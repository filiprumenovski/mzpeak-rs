[package]
name = "mzpeak"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
authors = ["mzPeak Contributors"]
description = "Independent experimental Parquet mass spectrometry readers and writers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filiprumenovski/mzpeak-rs"
documentation = "https://docs.rs/mzpeak"
homepage = "https://github.com/filiprumenovski/mzpeak-rs"
readme = "README.md"
keywords = ["mass-spectrometry", "proteomics", "metabolomics", "parquet", "bioinformatics"]
categories = ["science", "encoding", "parser-implementations"]
exclude = ["*.mzML", "*.raw", "*.parquet", "mzPeak_preprint_v02.pdf"]

[features]
default = ["mzml", "thermo"]
# Python bindings for PyO3 extension module.
python = ["dep:pyo3", "dep:numpy", "mzml"]
# mzML parsing (optional)
mzml = ["quick-xml", "base64", "flate2", "dep:libdeflater"]
# Bruker TDF parsing (optional) - includes rayon for parallel conversion
tdf = ["timsrust", "rayon"]
# Native Thermo RAW parsing (optional; no .NET runtime)
thermo = ["mzml"]
# Parallel mzML conversion
mzml-parallel = ["mzml", "rayon"]

[dependencies]
# Apache Arrow and Parquet for columnar storage
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd", "snap"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CSV/TSV parsing for SDRF
csv = "1.3"

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

# ZIP container support for single-file .mzpeak format
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Python bindings (optional)
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
numpy = { version = "0.21", optional = true }

# Bytes for Parquet reader ChunkReader trait
bytes = "1.9"

# Staging for atomic container writes
tempfile = "3.14"

# mzML parsing (optional)
quick-xml = { version = "0.37", features = ["encoding"], optional = true }
base64 = { version = "0.22", optional = true }
flate2 = { version = "1.0", optional = true }
libdeflater = { version = "1.26", optional = true }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }


# Parallel conversion (optional)
rayon = { version = "1.10", optional = true }

# Bruker TDF reader (path override; subject to change to git/published crate)
timsrust = { path = "vendor/timsrust", optional = true }

[lib]
name = "mzpeak"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "mzpeak-convert"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[lints.clippy]
unwrap_used = "warn"

[[example]]
name = "io_hotpath"
path = "examples/benchmarks/io_hotpath.rs"
required-features = ["mzml"]
