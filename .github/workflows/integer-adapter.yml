name: Integer adapter

on:
  pull_request:
    paths: ['python-adapter/**', '.github/workflows/integer-adapter.yml']
  push:
    branches: [main]
    paths: ['python-adapter/**', '.github/workflows/integer-adapter.yml']
  workflow_dispatch:

jobs:
  install-and-query:
    name: Install and query (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from source into the clean runner
        run: python -m pip install --no-cache-dir ./python-adapter
      - name: Check dependency resolution
        run: python -m pip check
      - name: Run bundled example using only the installed package
        run: python -I -m mzpeak_compat.example
      - name: Test query, zero, boundary, integrity and offline contracts
        run: python -I -m unittest discover -s python-adapter/tests -v
      - name: Test native decoder
        run: cargo test --locked --manifest-path python-adapter/native/Cargo.toml
