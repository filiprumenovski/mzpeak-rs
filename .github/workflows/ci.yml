name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo test --locked --features mzml-parallel,tdf
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets --features mzml-parallel,tdf -- -D clippy::correctness -D clippy::suspicious
      - run: cargo fmt --package mzpeak -- --check
      - run: cargo doc --locked --no-deps --features mzml-parallel,tdf
        env:
          RUSTDOCFLAGS: -D warnings
  python:
    name: Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin pytest 'numpy<2'
      - run: cargo check --locked --all-features --all-targets
      - run: maturin build --locked --features python --out dist
      - name: Install and test the matching interpreter's wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pytest python_tests/ -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py311
          path: dist/*.whl
