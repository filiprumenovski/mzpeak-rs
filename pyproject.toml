[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mzpeak"
version = "0.2.0"
description = "Streaming conversion and v2 Parquet mass spectrometry datasets"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "mzPeak Contributors" }
]
keywords = ["mass-spectrometry", "proteomics", "metabolomics", "parquet", "arrow", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.8,<3.13"
# NumPy backs the spectrum arrays; pyarrow is only needed for independent checks
dependencies = ["numpy>=1.23,<2"]

[project.optional-dependencies]
dev = ["pytest>=7", "maturin>=1.5,<2", "pyarrow==18.1.0"]

[project.urls]
Homepage = "https://github.com/filiprumenovski/mzpeak-rs"
Documentation = "https://docs.rs/mzpeak"
Repository = "https://github.com/filiprumenovski/mzpeak-rs"

[tool.maturin]
# Build for the Python extension module
features = ["python"]
# Python module name
module-name = "mzpeak"
# Bindings type
bindings = "pyo3"
# Strip symbols for smaller binaries
strip = true
# Compatibility with Python 3.8+
compatibility = "manylinux2014"

[tool.pytest.ini_options]
testpaths = ["tests", "python_tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
