[package]
name = "mzlab_decoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
